name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --quiet

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build
